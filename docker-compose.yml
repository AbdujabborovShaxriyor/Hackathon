services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legal_ai
      POSTGRES_USER: legal_ai
      POSTGRES_PASSWORD: legal_ai_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_ai -d legal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
      AUTO_MIGRATE_DB: "true"
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8001:8000"

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    env_file: .env
    environment:
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8002:8000"

  classification-service:
    build:
      context: .
      dockerfile: services/classification-service/Dockerfile
    env_file: .env
    environment:
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8000"

  rag-service:
    build:
      context: .
      dockerfile: services/rag-service/Dockerfile
    env_file: .env
    environment:
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8004:8000"

  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    env_file: .env
    environment:
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8005:8000"

  workflow-service:
    build:
      context: .
      dockerfile: services/workflow-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "8006:8000"

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
      AUTH_SERVICE_URL: http://auth-service:8000
      INGESTION_SERVICE_URL: http://ingestion-service:8000
      CLASSIFICATION_SERVICE_URL: http://classification-service:8000
      RAG_SERVICE_URL: http://rag-service:8000
      COMPLIANCE_SERVICE_URL: http://compliance-service:8000
      WORKFLOW_SERVICE_URL: http://workflow-service:8000
      AUTO_MIGRATE_DB: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
      ingestion-service:
        condition: service_started
      classification-service:
        condition: service_started
      rag-service:
        condition: service_started
      compliance-service:
        condition: service_started
      workflow-service:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres_data:
