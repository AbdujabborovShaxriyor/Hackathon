apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: legal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: legal_ai
            - name: POSTGRES_USER
              value: legal_ai
            - name: POSTGRES_PASSWORD
              value: legal_ai_password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: legal-ai
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: legal-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: legal-ai
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

