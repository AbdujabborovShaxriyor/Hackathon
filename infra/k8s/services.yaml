apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: legal-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: legal-ai/api-gateway:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
            - name: JWT_SECRET_KEY
              value: change-me-super-secret
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8000
            - name: INGESTION_SERVICE_URL
              value: http://ingestion-service:8000
            - name: CLASSIFICATION_SERVICE_URL
              value: http://classification-service:8000
            - name: RAG_SERVICE_URL
              value: http://rag-service:8000
            - name: COMPLIANCE_SERVICE_URL
              value: http://compliance-service:8000
            - name: WORKFLOW_SERVICE_URL
              value: http://workflow-service:8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: legal-ai
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8000

