apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: legal-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: legal-ai/auth-service:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://legal_ai:legal_ai_password@postgres:5432/legal_ai
            - name: JWT_SECRET_KEY
              value: change-me-super-secret
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: legal-ai
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
---
